  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:150px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 34px;z-index:6">
    <div style="position:relative">
      <dc-import name="Mascot" size="96" mood="cheer" hint-size="96px,96px"></dc-import>
    </div>
    <div style="display:flex;align-items:center;gap:10px;height:96px;padding:0 30px 0 22px;border-radius:999px;background:var(--sun);border:5px solid var(--ink);box-shadow:0 7px 0 var(--ink);font:700 30px/1 Fredoka,sans-serif"><i data-lucide="play" style="width:38px;height:38px;fill:var(--ink)"></i>Play</div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:8px;text-align:center;font:500 11px/1 Fredoka,sans-serif;color:var(--ink);opacity:.75;z-index:6">Developed by: muhibullah</div>
  <div style="position:absolute;right:16px;bottom:150px;z-index:6;width:52px;height:52px;border-radius:50%;background:var(--card);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;opacity:.85"><i data-lucide="lock" style="width:22px;height:22px"></i></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;offline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
