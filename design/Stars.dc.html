<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;gap:{{ gap }};align-items:center">
  <sc-for list="{{ stars }}" as="s" hint-placeholder-count="3">
    <div style="position:relative;width:{{ px }};height:{{ px }};flex:none">
      <div style="position:absolute;inset:0;background:var(--ink,#2B2340);clip-path:polygon(50% 0%,63% 33%,98% 36%,71% 58%,80% 94%,50% 74%,20% 94%,29% 58%,2% 36%,37% 33%)"></div>
      <div style="position:absolute;inset:{{ inset }};background:{{ s.fill }};clip-path:polygon(50% 0%,63% 33%,98% 36%,71% 58%,80% 94%,50% 74%,20% 94%,29% 58%,2% 36%,37% 33%)"></div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:50},&quot;n&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:0,&quot;max&quot;:3,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:28,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const n = this.props.n ?? 3, s = this.props.size ?? 28;
    return {
      px: s + 'px', inset: Math.max(3, Math.round(s * 0.16)) + 'px', gap: Math.round(s * 0.12) + 'px',
      stars: Array.from({ length: this.props.count ?? 3 }, (_, i) => i).map(i => ({ fill: i < n ? 'var(--sun,#FFC93C)' : 'var(--card,#fff)' }))
    };
  }
}
</script>
</body>
</html>
