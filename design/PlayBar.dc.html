<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box">
  <div style="width:72px;height:72px;flex:none;border-radius:50%;background:var(--sky);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink)"><i data-lucide="house" style="width:32px;height:32px"></i></div>
  <div style="display:flex;align-items:center;gap:9px">
    <sc-for list="{{ dots }}" as="d" hint-placeholder-count="6">
      <div style="width:{{ d.s }};height:{{ d.s }};border-radius:50%;background:{{ d.bg }};border:3px solid var(--ink);box-shadow:{{ d.ring }};opacity:{{ d.o }}"></div>
    </sc-for>
  </div>
  <div style="width:72px;height:72px;flex:none;border-radius:50%;background:var(--sun);border:4px solid var(--ink);box-shadow:{{ rshadow }};display:flex;align-items:center;justify-content:center;color:var(--ink)"><i data-lucide="volume-2" style="width:34px;height:34px"></i></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:90},&quot;current&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;total&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;pulse&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const t = this.props.total ?? 6, c = this.props.current ?? 1;
    return {
      rshadow: this.props.pulse ? '0 5px 0 var(--ink),0 0 0 10px rgba(255,201,60,.45)' : '0 5px 0 var(--ink)',
      dots: Array.from({ length: t }, (_, i) => {
        const n = i + 1;
        if (n < c) return { s: '18px', bg: 'var(--grass)', ring: 'none', o: 1 };
        if (n === c) return { s: '28px', bg: 'var(--sun)', ring: '0 0 0 4px rgba(255,201,60,.4)', o: 1 };
        return { s: '18px', bg: 'var(--card)', ring: 'none', o: 0.55 };
      })
    };
  }
}
</script>
</body>
</html>
